# 太初知识宇宙 — pre-commit hooks 配置
# 安装: pre-commit install
# 手动运行全部: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^_deprecated/
      - id: end-of-file-fixer
        exclude: ^_deprecated/
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        args: [--config=pyproject.toml]
        language_version: python3
        exclude: ^(_deprecated/|knowledge/wiki/_archived/)

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--settings-path=pyproject.toml]
        exclude: ^(_deprecated/|knowledge/wiki/_archived/)

  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        args: [--config=.flake8]
        additional_dependencies: [flake8-docstrings]
        exclude: ^(_deprecated/|knowledge/wiki/_archived/)

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, -r, .]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^(_deprecated/|knowledge/wiki/_archived/|knowledge/wiki/temp/)

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml, --no-namespace-packages, runtime/, config/]
        additional_dependencies: [types-PyYAML]
        pass_filenames: false
        exclude: "tools/.*"
